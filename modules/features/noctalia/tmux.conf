set -g status-style 'bg={{ colors.surface.default.hex }} fg={{ colors.on_surface.default.hex }}'
set -g mode-style 'bg={{ colors.primary.default.hex }} fg={{ colors.on_primary.default.hex }} bold'
set -g message-style 'bg={{ colors.primary.default.hex }} fg={{ colors.on_primary.default.hex }} bold'

set -g pane-border-style 'fg={{ colors.outline.default.hex }}'
set -g pane-active-border-style 'fg={{ colors.primary.default.hex }}'

set -g window-status-style 'fg={{ colors.on_surface_variant.default.hex }} bg={{ colors.surface.default.hex }}'
set -g window-status-current-style 'fg={{ colors.on_primary.default.hex }} bg={{ colors.primary.default.hex }} bold'
set -g window-status-bell-style 'fg={{ colors.on_error.default.hex }} bg={{ colors.error.default.hex }} bold'

set -g clock-mode-colour '{{ colors.primary.default.hex }}'
